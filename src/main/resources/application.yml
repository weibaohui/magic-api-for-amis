server:
  port: 32480
  # 配置静态资源启用 gzip 压缩
  compression:
    enabled: true
    min-response-size: 128
# 配置主数据源
spring:
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  datasource:
    url: jdbc:postgresql://postgres-service:5432/magic-api
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    #  data:
    # 配置mongo数据源
  #    mongodb:
  #      host: localhost
  #      port: 27017
  #      database: magicapi
  #      username: magicapi
  #      password: 123456
  # 配置redis数据源
#  redis:
#    host: localhost
#    port: 6379
#    database: 4
#    timeout: 5000
magic-api:
  web: /magic/web
  resource:
    type: database  # file database配置接口存储方式，这里选择存在数据库中 file 时location生效
    table-name: magic_api_file  # 数据库中的表名
    prefix: /api  # 前缀
    show-sql: true #配置打印SQL
    auto-import-module: db,env,http,log,request,response,magic  # 自动导入的模块
    auto-import-package: java.lang.*,java.util.* #自动导包
    sql-column-case: camel #启用驼峰命名转换
    editor-config: classpath:./magic-editor.js #编辑器配置
    support-cross-domain: true # 跨域支持，默认开启
    compile-cache-size: 500 #配置编译缓存容量
    backup-config: #备份相关配置
      enable: true #是否启用
      max-history: -1 #备份保留天数，-1为永久保留
      resource-type: file #备份存储方式，默认为文件，可选 database
      datasource: magic  #指定数据源（单数据源时无需配置，多数据源时默认使用主数据源，如果存在其他数据源中需要指定。）
      table-name: magic_api_backup #使用数据库存储备份时的表名
  # 其它配置请参考 https://ssssssss.org/config/
  response-code-config:
    success: 200 #执行成功的code值
    invalid: 400 #参数验证未通过的code值
    exception: 500 #执行出现异常的code值
  #自定义响应Json结构
  response: |- #配置JSON格式，格式为magic-script中的表达式
    {
      status: code,
      msg: message,
      data,
      timestamp,
      requestTime,
      executeTime,
    }
  page:
    size: size # 页大小的参数名称
    page: page # 页码的参数名称
    default-page: 1 # 未传页码时的默认首页
    default-size: 10 # 未传页大小时的默认页大小
  security: # 安全配置
    username: admin # 登录用的用户名
    password: X8MjB1yz # 登录用的密码
